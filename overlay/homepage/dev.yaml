apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: github
  path: ./template/homepage/dev
  prune: true
  wait: true
  dependsOn:
  - name: gateway
  - name: metrics-server
