apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: github
  path: ./template/gateway/mu
  prune: true
  wait: true
  dependsOn:
  - name: nginx-gateway-fabric
