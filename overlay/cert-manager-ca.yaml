apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-ca
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: github
  path: ./template/cert-manager-ca/base
  prune: true
  wait: true
  dependsOn:
  - name: cert-manager
