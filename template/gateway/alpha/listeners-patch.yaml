- op: add
  path: /spec/listeners/-
  value:
    name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
    hostname: '*.jkdev.duckdns.org'
- op: add
  path: /spec/listeners/-
  value:
    name: https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    hostname: '*.jkdev.duckdns.org'
    tls:
      certificateRefs:
      - kind: Secret
        group: ""
        name: duckdns-cert
- op: add
  path: /spec/listeners/-
  value:
    name: test
    port: 5678
    protocol: TCP
    allowedRoutes:
      namespaces:
        from: All
