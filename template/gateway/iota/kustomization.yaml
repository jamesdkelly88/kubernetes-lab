apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nginx-gateway
resources:
- ../base
patches:
- path: certificate-patch.yaml
  target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: duckdns-cert
- path: listeners-patch.yaml
  target:
    group: gateway.networking.k8s.io
    version: v1
    kind: Gateway
    name: gateway
