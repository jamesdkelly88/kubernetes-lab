apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base/

patches:
- path: allowed-hosts-patch.yaml
  target:
    version: v1
    kind: Deployment
    name: homepage
- path: httproute-patch.yaml
  target:
    group: gateway.networking.k8s.io
    version: v1
    kind: HTTPRoute
    name: homepage
