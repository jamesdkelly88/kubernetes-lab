apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - selfsigned-issuer.yaml
  - selfsigned-ca.yaml
  - ca-issuer.yaml

configMapGenerator:
- name: values
  files:
  - values.yaml

configurations:
- kustomizeconfig.yaml