apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Test application
    gethomepage.dev/group: Other applications
    gethomepage.dev/icon: nginx
    gethomepage.dev/name: Echo
spec:
  parentRefs:
  - name: gateway
    namespace: nginx-gateway
    sectionName: http
  hostnames: ["echo.jkdev.duckdns.org"]
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: echo
      port: 5678